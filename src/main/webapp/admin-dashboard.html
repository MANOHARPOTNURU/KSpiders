<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Assessment System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 5px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #374151;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .approved {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .approve-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .reject-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>Assessment System - Admin</h1>
    <button class="logout-btn">Logout</button>
</header>

<div class="container">

    <div class="welcome">
        <h2>Admin Dashboard</h2>
        <p>Manage users and assessment access.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <div class="number">2</div>
        </div>

        <div class="card">
            <h3>Pending Approval</h3>
            <div class="number">1</div>
        </div>

        <div class="card">
            <h3>Approved Users</h3>
            <div class="number">1</div>
        </div>

    </div>

    <div class="section">

        <h2>User Management</h2>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Approval Status</th>
                <th>Assessment Access</th>
            </tr>
            </thead>

            <tbody>

            <tr>
                <td>1</td>
                <td>Admin User</td>
                <td>admin@test.com</td>
                <td>ADMIN</td>
                <td>
                    <span class="status approved">APPROVED</span>
                </td>
                <td>Admin</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Test User</td>
                <td>user@test.com</td>
                <td>USER</td>
                <td>
                    <span class="status pending">PENDING</span>
                </td>
                <td>
                    <button class="approve-btn">Approve</button>
                    <button class="reject-btn">Reject</button>
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
