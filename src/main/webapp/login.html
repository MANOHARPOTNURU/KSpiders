<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assessment System - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 420px;
            background: white;
            padding: 40px;

            border-radius: 12px;

            box-shadow:
                    0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .login-card h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;

            color: #6b7280;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-bottom: 20px;
            color: #dc2626;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="login-card">

    <h1>Assessment System</h1>

    <p class="subtitle">
        Sign in to continue
    </p>


    <!-- Error messages -->

    <script>

        const params = new URLSearchParams(window.location.search);

        const error = params.get("error");

        if (error === "invalid") {

            document.write(
                '<div class="message">Invalid email or password.</div>'
            );

        } else if (error === "notapproved") {

            document.write(
                '<div class="message">Your account has not been approved by Admin yet.</div>'
            );

        } else if (error === "registered") {

            document.write(
                '<div style="text-align:center;color:green;margin-bottom:20px;font-weight:bold;">Registration successful. Please login.</div>'
            );

        }

    </script>


    <form action="login" method="post">


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
            >

        </div>


        <button
                type="submit"
                class="login-button">

            Login

        </button>


    </form>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create an account
        </a>

    </div>


</div>


</body>

</html>
